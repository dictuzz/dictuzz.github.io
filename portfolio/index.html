<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Benedictus">
    <link rel="manifest" href="/site.webmanifest">

    <title>Benedictus Richard Ricardo | Portfolio</title>
    <meta name="description"
        content="A curated gallery of fictional case studies designed to preview a premium portfolio of systems, operations, service design, and execution.">
    <meta name="author" content="Benedictus Richard Ricardo">
    <link rel="canonical" href="https://dictuzz.me/portfolio/">
    <meta name="theme-color" content="#10161d">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dictuzz.me/portfolio/">
    <meta property="og:title" content="Benedictus Richard Ricardo | Portfolio">
    <meta property="og:description"
        content="A curated gallery of case studies across systems, service design, live experience, and meaningful execution.">
    <meta property="og:image" content="https://dictuzz.me/assets/images/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://dictuzz.me/portfolio/">
    <meta name="twitter:title" content="Benedictus Richard Ricardo | Portfolio">
    <meta name="twitter:description"
        content="A curated gallery of case studies across systems, service design, live experience, and meaningful execution.">
    <meta name="twitter:image" content="https://dictuzz.me/assets/images/og-image.png">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Benedictus Richard Ricardo Portfolio",
        "url": "https://dictuzz.me/portfolio/",
        "description": "A curated gallery of fictional but polished case studies by Benedictus Richard Ricardo."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/portfolio.css">
</head>

<body class="portfolio-gallery-page">
    <header class="portfolio-pagebar">
        <div class="portfolio-pagebar__brand" aria-label="dictuzz portfolio identity">
            <span class="portfolio-pagebar__logo">
                <img src="/assets/images/dictuzz.webp" alt="dictuzz logo" width="56" height="56">
            </span>
            <span class="portfolio-pagebar__copy">
                <strong>dictuzz</strong>
                <small>Portfolio</small>
            </span>
        </div>

        <button class="theme-toggle portfolio-pagebar__toggle" id="theme-toggle" aria-label="Toggle theme">
            <i class="fas fa-sun" id="theme-icon"></i>
        </button>
    </header>

    <main class="portfolio-shell">
        <section class="portfolio-hero">
            <div class="portfolio-hero__copy">
                <p class="portfolio-kicker" id="portfolio-hero-kicker"></p>
                <h1 class="portfolio-title" id="portfolio-hero-title"></h1>
                <p class="portfolio-lede" id="portfolio-hero-intro"></p>
                <p class="portfolio-note" id="portfolio-hero-note"></p>
            </div>
            <div class="portfolio-stat-strip" id="portfolio-stats" aria-label="Portfolio metrics"></div>
        </section>

        <section class="portfolio-featured">
            <div class="portfolio-section-head">
                <p class="portfolio-kicker">Featured Studies</p>
                <h2>Two flagship projects that define the tone of the archive.</h2>
            </div>
            <div class="portfolio-featured__grid" id="portfolio-featured-grid" aria-live="polite"></div>
        </section>

        <section class="portfolio-gallery" id="gallery">
            <div class="portfolio-section-head portfolio-section-head--split">
                <div>
                    <p class="portfolio-kicker">Project Gallery</p>
                    <h2>A uniform grid, built for clarity.</h2>
                </div>
                <p class="portfolio-gallery__caption" id="portfolio-gallery-caption"></p>
            </div>

            <div class="portfolio-filters" id="portfolio-filters" aria-label="Portfolio categories"></div>
            <div class="portfolio-grid" id="portfolio-grid" aria-live="polite"></div>
        </section>

        <section class="portfolio-closing card">
            <div class="portfolio-closing__copy">
                <p class="portfolio-kicker">What this preview proves</p>
                <h2 id="portfolio-closing-title"></h2>
                <p id="portfolio-closing-copy"></p>
            </div>
            <div class="portfolio-closing__actions" id="portfolio-closing-actions"></div>
        </section>
    </main>

    <script type="module" src="/js/portfolio-index.js"></script>
</body>

</html>
