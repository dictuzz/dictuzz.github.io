backend:
  name: github
  repo: dictuzz/dictuzz.github.io
  branch: main

media_folder: "portfolio/assets/images"
public_folder: "assets/images"

collections:
  - name: "portfolio"
    label: "Portfolio Content"
    file: "portfolio/data/portfolio.json"
    description: "Edit the main portfolio sections"
    fields:
      - label: "Global Settings"
        name: "global"
        widget: "object"
        fields:
          - {label: "Author Name", name: "author", widget: "string"}
          - {label: "Contact Email", name: "email", widget: "string"}
          - label: "Navigation Links"
            name: "navigation"
            widget: "list"
            fields:
              - {label: "Main Label", name: "label", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "URL Target", name: "url", widget: "string"}
          - label: "Social Links"
            name: "socials"
            widget: "list"
            fields:
              - {label: "Platform", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - label: "Footer Info"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Role Tagline", name: "tagline", widget: "string"}
              - {label: "Copyright Notice", name: "copyright", widget: "string"}

      - label: "Act I: Curtain (Hero)"
        name: "curtain"
        widget: "object"
        fields:
          - label: "Name Display"
            name: "textLines"
            widget: "list"
            field: {widget: "string"}
          - {label: "Hero Tagline", name: "tagline", widget: "text"}

      - label: "Act II: Proof (Experience Grid)"
        name: "proof"
        widget: "object"
        fields:
          - label: "Experiences"
            name: "experiences"
            widget: "list"
            summary: '{{fields.hook}} - {{fields.company}}'
            fields:
              - {label: "Unique ID", name: "id", widget: "string"}
              - {label: "Headline / Hook", name: "hook", widget: "string"}
              - {label: "Job Category / Role", name: "role", widget: "string"}
              - {label: "Company / Organization", name: "company", widget: "string"}
              - {label: "Date Range", name: "date", widget: "string"}
              - {label: "Background Image", name: "image", widget: "image"}
              - {label: "Image Alt Text", name: "alt", widget: "string"}
              - {label: "Detailed Story (Markdown supported)", name: "body", widget: "markdown"}
              - label: "External Links (Optional)"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - {label: "Button Text", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - {label: "Key Takeaway (Gold Quote)", name: "takeaway", widget: "text"}

      - label: "Act III: Thread (Story)"
        name: "thread"
        widget: "object"
        fields:
          - {label: "Main Thesis Statement", name: "thesis", widget: "text"}
          - label: "Story Clusters"
            name: "clusters"
            widget: "list"
            summary: '{{fields.title}}'
            fields:
              - {label: "Theme Title", name: "title", widget: "string"}
              - {label: "Story Content", name: "content", widget: "markdown"}
          - label: "Quick Facts (Footnotes)"
            name: "footnotes"
            widget: "list"
            fields:
              - {label: "Category", name: "title", widget: "string"}
              - {label: "Description", name: "value", widget: "string"}

      - label: "Act IV: Signal (Contact)"
        name: "signal"
        widget: "object"
        fields:
          - {label: "Closing Sentence", name: "sentence", widget: "string"}
          - label: "Contact Form Setup"
            name: "form"
            widget: "object"
            fields:
              - {label: "Formspree Endpoint", name: "action", widget: "string"}
              - {label: "Submit Button Text", name: "submit", widget: "string"}
              - label: "Input Fields"
                name: "fields"
                widget: "object"
                fields:
                  - label: "Name Input"
                    name: "name"
                    widget: "object"
                    fields: [{label: "Label", name: "label", widget: "string"}, {label: "Placeholder", name: "placeholder", widget: "string"}]
                  - label: "Email Input"
                    name: "email"
                    widget: "object"
                    fields: [{label: "Label", name: "label", widget: "string"}, {label: "Placeholder", name: "placeholder", widget: "string"}]
                  - label: "Phone Input"
                    name: "phone"
                    widget: "object"
                    fields: [{label: "Label", name: "label", widget: "string"}, {label: "Placeholder", name: "placeholder", widget: "string"}]
                  - label: "Topic Input"
                    name: "topic"
                    widget: "object"
                    fields: [{label: "Label", name: "label", widget: "string"}, {label: "Placeholder", name: "placeholder", widget: "string"}]

  - name: "links_page"
    label: "Links Tree Page"
    file: "portfolio/data/links.json"
    description: "Edit the links page content"
    fields:
      # Since links.json is an array at the root `[ {...}, {...} ]`, the file format for array is actually list without a name, but Decap needs a wrapper unless it's a folder collection. 
      # Actually, file collections editing a JSON array at root require a specific setup or the JSON must be wrapped in an object. 
      # Let's check `links.json`. It is `[ {id:...}, ... ]`. Decap CMS `file` collection expects an object. It cannot handle an array at the root of a JSON file.
      # Wait, I need to wrap `links.json` in an object: `{ "zones": [ ... ] }` instead of `[ ... ]`.
      - label: "Link Zones"
        name: "zones"
        widget: "list"
        summary: '{{fields.title}}'
        fields:
          - {label: "Zone ID", name: "id", widget: "string"}
          - {label: "Sub Title", name: "title", widget: "string"}
          - {label: "Main Banner Label", name: "label", widget: "string"}
          - {label: "CSS Modifier Class", name: "className", widget: "string", required: false}
          - label: "Individual Links"
            name: "items"
            widget: "list"
            fields:
              - {label: "Link Title", name: "title", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Icon (FontAwesome Class)", name: "icon", widget: "string"}
              - {label: "Small Description", name: "desc", widget: "string"}
              - {label: "Open in new tab? (_blank)", name: "target", widget: "string", required: false}
