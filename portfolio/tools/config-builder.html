<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Builder - dictuzz.github.io</title>
    <style>
        :root {
            --bg: #0A0E17;
            --card: #121824;
            --text: #fff;
            --accent: #00F5D4;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .editor {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .preview {
            background: #000;
            border: 1px solid #333;
            height: 90vh;
            position: sticky;
            top: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        input,
        textarea,
        select {
            background: #1A2332;
            border: 1px solid #333;
            color: #fff;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
        }

        label {
            font-weight: bold;
            font-size: 0.9em;
            color: #aaa;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .section {
            background: var(--card);
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="editor">
        <h1>Config Builder</h1>
        <p>Edit fields below to generate your <code>config.js</code>.</p>

        <div class="section">
            <label>Profile Name</label>
            <input type="text" id="p_name" value="dictuzz" oninput="update()">
            <label>Tagline</label>
            <input type="text" id="p_tag" value="Data Scientist • Creator" oninput="update()">
            <label>Avatar URL</label>
            <input type="text" id="p_av" value="assets/images/dictuzz.webp" oninput="update()">
        </div>

        <div class="section">
            <label>Primary Color</label>
            <input type="color" id="c_pri" value="#00F5D4" oninput="update()">
            <label>Secondary Color</label>
            <input type="color" id="c_sec" value="#7B61FF" oninput="update()">
            <label>Background Engine</label>
            <select id="bg_eng" onchange="update()">
                <option value="aurora">Dark Aurora</option>
                <option value="network">Light Network</option>
                <option value="static">Static</option>
            </select>
        </div>

        <button class="btn" onclick="copyConfig()">Copy JS to Clipboard</button>
    </div>

    <div class="preview">
        <iframe id="frame" src="../index.html"></iframe>
    </div>

    <script>
        function update() {
            const config = {
                siteTitle: document.getElementById('p_name').value + " | Portfolio",
                theme: {
                    colors: {
                        primary: document.getElementById('c_pri').value,
                        secondary: document.getElementById('c_sec').value
                    },
                    background: document.getElementById('bg_eng').value
                },
                profile: {
                    name: document.getElementById('p_name').value,
                    tagline: document.getElementById('p_tag').value,
                    avatar: document.getElementById('p_av').value,
                    bio: ""
                },
                // ... Truncated for builder simplicity
            };

            // In a real builder, we would postMessage to the iframe to update live.
            // For now, this is a static generator.
        }

        function copyConfig() {
            const js = `const CONFIG_DATA = ${JSON.stringify(generateFullConfig(), null, 4)};`;
            navigator.clipboard.writeText(js);
            alert("Copied to clipboard! Paste into config.js");
        }

        function generateFullConfig() {
            return {
                siteTitle: document.getElementById('p_name').value + " | Portfolio",
                theme: {
                    storageKey: 'dictuzz-theme',
                    default: 'dark',
                    background: document.getElementById('bg_eng').value,
                    colors: {
                        primary: document.getElementById('c_pri').value,
                        secondary: document.getElementById('c_sec').value
                    }
                },
                profile: {
                    name: document.getElementById('p_name').value,
                    tagline: document.getElementById('p_tag').value,
                    avatar: document.getElementById('p_av').value,
                    bio: ""
                },
                links: [] // Placeholder
            };
        }
    </script>
</body>

</html>
