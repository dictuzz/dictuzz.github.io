<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitemap | Benedictus Richard Ricardo</title>
  <meta name="description"
    content="I turn operational chaos into automated systems. Data Science Student & Automation Specialist." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <!-- Bio Styles -->
  <link rel="stylesheet" href="css/bio.css" />
  <!-- custom-animations.css merged into bio.css -->

  <style>
    /* Override bio.css specific footer to use standard one */
    .bio-footer {
      display: none !important;
    }

    /* Ensure footer aligns with bio theme */
    .site-footer {
      width: 100%;
      max-width: 1000px;
      margin-top: 5rem;
      background: transparent;
      border-top: 1px solid var(--bio-border);
    }
  </style>
</head>

<body>
  <div id="global-nav"></div>

  <!-- Theme Toggle (Refined) -->
  <button class="theme-toggle-float" id="theme-toggle" aria-label="Toggle Theme">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Grain Overlay -->
  <div class="grain-overlay"></div>

  <!-- Background Orbs -->
  <div class="bio-background">
    <div class="bio-orb primary"></div>
    <div class="bio-orb secondary"></div>
  </div>

  <main class="bio-container">
    <!-- Profile Header -->
    <header class="bio-header">
      <div class="profile-avatar-wrapper">
        <div class="profile-frame">
          <img src="assets/images/dictuzz.webp" alt="Benedictus Richard Ricardo" class="profile-avatar" />
        </div>
        <!-- Pulsing Status Indicator -->
        <div class="profile-status-indicator" title="Open to Work">
          <div class="status-ping"></div>
        </div>
      </div>

      <h1 class="profile-name">Benedictus Richard Ricardo</h1>

      <div class="profile-role">
        <span>Data Science Student & Automation Specialist</span>
      </div>

      <div class="profile-meta">
        <div class="meta-item">
          <span class="status-dot"></span>
          <span>Open to collaborations</span>
        </div>
        <!-- Link to Google Maps -->
        <a href="https://share.google/7wRzDe5yPlBB393Q0" target="_blank" class="meta-item"
          style="text-decoration: none; color: inherit">
          <i class="fas fa-map-marker-alt"></i>
          <span>Tangerang, Indonesia</span>
        </a>
        <div class="meta-item">
          <!-- Animating Time Display -->
          <span id="local-time" class="time-display">--:--</span>
        </div>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="bio-grid" id="links-container">
      <!-- Content will be injected by js/links-data.js -->
    </div>

    <!-- Standard Footer Integration -->
    <div id="global-footer"></div>
  </main>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script src="js/links-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/content-loader.js"></script>
  <script src="js/bio.js"></script>
</body>

</html>
