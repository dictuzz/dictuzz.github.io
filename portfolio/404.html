<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Access | dictuzz</title>
  <meta name="description" content="Protected portfolio access for Benedictus Richard Ricardo. Enter the password to continue to the case board.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --board-bg: #1a1f1a;
      --board-edge: #0f1210;
      --chalk: #f2ede4;
      --paper: #f5efe0;
      --ink: #1a1410;
      --ink-soft: #3d3228;
      --accent: #8b1a1a;
      --link: #1a3a8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--chalk);
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 28%, rgba(0,0,0,0.35) 72%, rgba(0,0,0,0.56) 100%),
        radial-gradient(circle at 18% 14%, rgba(255,255,255,0.025), transparent 18%),
        radial-gradient(circle at 78% 22%, rgba(255,255,255,0.02), transparent 20%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px),
        var(--board-bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      border: 8px solid var(--board-edge);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    .card {
      width: min(100%, 720px);
      padding: 48px 28px 32px;
      border: 1px solid rgba(26, 20, 16, 0.16);
      background:
        linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)),
        var(--paper);
      background-size: 20px 20px, 20px 20px, auto, auto;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3), 4px 4px 8px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 0, 0, 0.2);
      color: var(--ink);
      transform: rotate(-1.2deg);
      position: relative;
    }
    .pin {
      position: absolute;
      left: 50%;
      top: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 35% 35%, #c4a882, #8b7355);
      box-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    .eyebrow {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(26, 20, 16, 0.2);
      color: var(--link);
      font: 700 0.72rem/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 0.98;
      font-style: italic;
    }
    p {
      margin: 0 0 16px;
      font-size: 1rem;
      line-height: 1.8;
      color: var(--ink-soft);
    }
    form {
      display: grid;
      gap: 14px;
      margin-top: 10px;
    }
    label {
      display: grid;
      gap: 8px;
      font: 700 0.74rem/1.4 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--link);
    }
    input {
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(26,20,16,0.24);
      background: rgba(255,252,246,0.86);
      color: var(--ink);
      font: 700 0.92rem/1.2 "Courier New", monospace;
      letter-spacing: 0.08em;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
      padding-right: 120px;
    }
    .actions button,
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      color: inherit;
      text-decoration: none;
      background: transparent;
      font: 700 0.78rem/1 Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .actions button {
      background: var(--ink);
      color: var(--paper);
    }
    .help {
      min-height: 20px;
      margin: 0;
      font-size: 0.92rem;
      color: var(--accent);
    }
    .stamp {
      position: absolute;
      right: 24px;
      bottom: 22px;
      width: 98px;
      height: 98px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font: 700 0.86rem/1.2 "Courier New", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: rotate(14deg);
      opacity: 0.85;
      text-align: center;
    }
    @media (max-width: 640px) {
      .card { padding: 44px 20px 24px; }
      .eyebrow { flex-direction: column; }
      .actions { padding-right: 0; }
      .stamp {
        position: static;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <span class="pin" aria-hidden="true"></span>
    <div class="eyebrow">
      <span>THE PORTFOLIO CHRONICLE</span>
      <span>ACCESS REQUIRED</span>
    </div>
    <h1>ENTER THE ARCHIVE KEY</h1>
    <p>This public portfolio route is protected. Enter the correct password to continue to the case board.</p>
    <form action="/portfolio/api/portfolio-auth" method="post">
      <input name="next" type="hidden" value="/portfolio/">
      <label for="portfolio-passphrase">Archive key</label>
      <input id="portfolio-passphrase" name="passphrase" type="password" autocomplete="current-password" placeholder="Enter password">
      <p class="help" aria-live="polite">Wrong password attempts will be redirected to the contact page.</p>
      <div class="actions">
        <button type="submit">Unlock Portfolio</button>
        <a href="/">Return to Base</a>
        <a href="/resume/#connect">Contact Benedictus</a>
      </div>
    </form>
    <span class="stamp">CASE LOCKED</span>
  </article>
</body>
</html>
