<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Benedictus" />
  <link rel="manifest" href="/site.webmanifest" />

  <title>Page Not Found - Benedictus Richard Ricardo</title>
  <meta name="author" content="Benedictus Richard Ricardo" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io;" />
  <meta name="description" content="Page not found. You've ventured into the unknown. Return to the main portfolio." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dictuzz.me/" />
  <meta property="og:title" content="404 | Lost in the Data Void" />
  <meta property="og:description"
    content="This link is broken, but my systems aren't. Redirecting you to the main portfolio." />
  <meta property="og:image" content="https://dictuzz.me/assets/images/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="404 | Lost in the Data Void" />
  <meta property="twitter:image" content="https://dictuzz.me/assets/images/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="/portfolio/css/bundle.css" />
</head>

<body class="error-page">
  <global-nav></global-nav>
  <!-- Ambient Background Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <main class="container error-container">
    <div class="error-content">
      <div class="glitch-wrapper">
        <h1 class="error-code" data-text="404">404</h1>
      </div>
      <h2 class="error-title">System Malfunction</h2>
      <p class="error-message">
        The signal has been lost. You've drifted too far into the void.
        Realign your coordinates to return to safety.
      </p>

      <a href="/portfolio/" class="link-button error-home-btn">
        <div class="link-icon">
          <i class="fas fa-satellite-dish"></i>
        </div>
        <span class="link-label">ay ay captain, send me back</span>
        <i class="fas fa-arrow-right link-arrow"></i>
      </a>
    </div>
  </main>

  <global-footer></global-footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="/portfolio/js/content-loader.js"></script>
  <script type="module" src="/portfolio/js/core.js"></script>
  <script>
    // Simple random glitch trigger for extra interactivity
    const glitchText = document.querySelector('.error-code');

    if (glitchText) {
      setInterval(() => {
        if (Math.random() > 0.9) {
          glitchText.style.setProperty(
            '--skew-x',
            Math.random() * 20 - 10 + 'deg'
          );
          setTimeout(() => {
            glitchText.style.setProperty('--skew-x', '0deg');
          }, 100);
        }
      }, 2000);

      glitchText.addEventListener('mouseover', () => {
        glitchText.classList.add('force-glitch');
      });

      glitchText.addEventListener('mouseout', () => {
        glitchText.classList.remove('force-glitch');
      });
    }
  </script>
</body>

</html>
