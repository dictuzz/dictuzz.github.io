    <main class="signal">

        <!-- ════════════════════════════════════════
             HERO SENTENCE
             ════════════════════════════════════════ -->
        <section class="signal-hero">
            <h1 class="signal-sentence"><!-- Injected via JS --></h1>
        </section>

        <!-- ════════════════════════════════════════
             CHANNELS
             ════════════════════════════════════════ -->
        <section class="signal-channels">
            <!-- Details injected via JS -->
        </section>

        <!-- ════════════════════════════════════════
             COMMUNICATION FORM
             ════════════════════════════════════════ -->
        <section class="signal-form-wrapper">
            <form action="#" method="POST" class="signal-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="+62 ...">
                </div>
                <div class="form-group">
                    <label for="topic">Topic</label>
                    <textarea id="topic" name="topic" rows="4" placeholder="How can I help you organize..."
                        required></textarea>
                </div>
                <button type="submit" class="signal-submit">Initialize Connection</button>
            </form>
        </section>

        <!-- ════════════════════════════════════════
             MEETING SCHEDULER (Static for now, could be dynamic)
             ════════════════════════════════════════ -->
        <section class="signal-meeting">
            <div class="meeting-details">
                <p class="meeting-note">Prefer a direct conversation?</p>
                <a href="https://calendly.com/" target="_blank" rel="noopener" class="meeting-link">Schedule a Briefing
                    →</a>
            </div>
        </section>

    </main>
