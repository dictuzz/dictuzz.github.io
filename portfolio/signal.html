        <details class="meeting-details">
            <summary>Schedule our Meeting!</summary>
            <form action="https://formspree.io/f/xlgwgero" method="POST" class="signal-form">
                <label>
                    Full Name
                    <input type="text" name="name" required placeholder="John Doe">
                </label>
                <label>
                    Email Address
                    <input type="email" name="email" required placeholder="john@example.com">
                </label>
                <label>
                    Phone Number (International format)
                    <input type="tel" name="phone" placeholder="+62 812 3456 7890">
                </label>
                <label>
                    When do you want to meet me?
                    <input type="datetime-local" name="meeting_time" required>
                </label>
                <label>
                    What topic do we will talk about
                    <textarea name="topic" required placeholder="Project collaboration, consultation, etc."
                        rows="4"></textarea>
                </label>
                <button type="submit">Send Request</button>
            </form>
        </details>
