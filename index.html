<body class="home-page">
    <main class="bio-shell">
        <section class="bio-card card reveal">
            <div class="bio-card__header">
                <button class="theme-toggle theme-toggle--light" id="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>

                <div class="bio-mark" aria-hidden="true">
                    <img src="/assets/images/favicon.png" alt="" width="96" height="96">
                </div>

                <div class="bio-avatar">
                    <div class="bio-avatar__frame">
                        <img src="/assets/images/Aku.webp" alt="Benedictus Richard Ricardo" width="930" height="1280">
                    </div>
                </div>

                <h1 class="bio-title">dictuzz</h1>
                <p class="bio-text">Quam Plurimi et Quam Aptissimi</p>
                <div class="bio-meta" aria-label="Availability and local time">
                    <span class="bio-status">
                        <span class="bio-status__dot" aria-hidden="true"></span>
                        <span>Available</span>
                    </span>
                    <span class="bio-meta__item" id="local-date">Loading date</span>
                    <span class="bio-meta__item" id="local-time">Loading time</span>
                </div>
            </div>

            <!-- Problem Solver Demo -->
            <div class="problem-solver mt-6 reveal">
                <h2 class="problem-solver__title"><i class="fas fa-lightbulb"></i> How I'd Solve Your Problem</h2>
                <div class="problem-solver__select-wrapper mt-4">
                    <label for="problem-select" class="sr-only">Select your biggest operational challenge</label>
                    <select id="problem-select" class="problem-solver__select glass glass--hover">
                        <option value="" disabled selected>Tell me your biggest operational challenge...</option>
                        <option value="reporting">Manual reporting takes too long</option>
                        <option value="events">Event coordination is chaotic</option>
                        <option value="onboarding">Team onboarding & knowledge transfer is slow</option>
                    </select>
                    <i class="fas fa-chevron-down select-icon"></i>
                </div>
                
                <div id="solution-container" class="problem-solver__solution mt-4" aria-live="polite" hidden>
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="accordion mt-6" aria-label="Link folders">
                <!-- Dynamically populated via js/home.js and data/links.json -->
            </div>

            <footer class="global-footer">
                <nav class="global-footer__nav" aria-label="Global navigation">
                    <a href="/" class="global-footer__link" aria-current="page">Links</a>
                    <a href="/resume/" class="global-footer__link">Resume</a>
                    <a href="/portfolio/" class="global-footer__link">Portfolio</a>
                </nav>

                <div class="global-footer__contacts">
                    <a href="mailto:contact@dictuzz.me" class="global-footer__contact-link" aria-label="Email Me"><i
                            class="fas fa-envelope"></i> contact@dictuzz.me</a>
                    <span class="global-footer__divider">&bull;</span>
                    <a href="https://linkedin.com/in/dictuzz" class="global-footer__contact-link" target="_blank"
                        rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i> LinkedIn</a>
                    <span class="global-footer__divider">&bull;</span>
                    <a href="/terms/" class="global-footer__contact-link"><i class="fas fa-file-contract"></i> Terms</a>
                </div>

                <p class="global-footer__copy">
                    &copy; 2026 Benedictus Richard Ricardo. All rights reserved.
                    <span>Quam Plurimi et Quam Aptissimi.</span>
                </p>
            </footer>
        </section>
