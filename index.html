  <!-- Google Analytics 4 -->
  <script>
    // Config is loaded via config.js at the bottom, but GA needs earliest execution
    // However, since config.js defines CONFIG_DATA (const), we moved config.js to head or handle this safely.
    // ACTUAL FIX: We will load config.js in HEAD instead of body to ensure it is available early.
  </script>
  <script src="config.js"></script>
  <script>
    // Load GA only if config exists and analytics enabled
    if (typeof CONFIG_DATA !== 'undefined' && CONFIG_DATA.analytics && CONFIG_DATA.analytics.enabled) {
      const script = document.createElement('script');
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${CONFIG_DATA.analytics.id}`;
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', CONFIG_DATA.analytics.id);
    }
  </script>
