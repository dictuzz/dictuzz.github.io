<body class="home-page">
    <main class="bio-shell">
        <section class="bio-card card reveal">
            <div class="bio-card__header">
                <div class="bio-toolbar">
                    <div class="bio-mark" aria-hidden="true">
                        <img src="/assets/images/favicon.png" alt="" width="96" height="96">
                    </div>

                    <button class="theme-toggle theme-toggle--light" id="theme-toggle" aria-label="Toggle theme">
                        <i class="fas fa-moon" id="theme-icon"></i>
                    </button>
                </div>

                <div class="bio-avatar">
                    <div class="bio-avatar__frame">
                        <img src="/assets/images/Aku.webp" alt="Benedictus Richard Ricardo" width="930" height="1280">
                    </div>
                </div>

                <p class="bio-nameplate"></p>
                <h1 class="bio-title"></h1>
                <p class="bio-text"></p>
                <div class="bio-meta" aria-label="Availability and local time">
                    <span class="bio-status">
                        <span class="bio-status__dot" aria-hidden="true"></span>
                        <span></span>
                    </span>
                    <span class="bio-meta__item" id="local-date">Loading date</span>
                    <span class="bio-meta__item" id="local-time">Loading time</span>
                </div>
            </div>

            <div class="accordion mt-6" aria-label="Link folders">
                <!-- Dynamically populated via js/home.js and /content/home.json -->
            </div>

            <footer class="global-footer"></footer>
        </section>
    </main>

    <script type="module" src="/js/home.js"></script>
</body>

</html>
