name: Validate Site
on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'resume/**'
      - 'portfolio/**'
      - 'index.html'
      - '404.html'
      - 'terms/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Shared Content
        run: npm run validate:content

      - name: Run Root Tests
        run: npm test
