name: Validate Portfolio
on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'js/**'
      - 'resume/**'
      - 'portfolio-app/**'
      - 'index.html'
      - 'terms/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'portfolio-app/package-lock.json'

      - name: Install Dependencies
        working-directory: portfolio-app
        run: npm ci

      - name: Validate Shared Content
        working-directory: .
        run: npm run validate:content

      - name: Typecheck Next.js App
        working-directory: portfolio-app
        run: npm run typecheck

      - name: Build Next.js App
        working-directory: portfolio-app
        run: npm run build
